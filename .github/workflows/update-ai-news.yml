name: Update AI News

on:
  schedule:
    # 08:00 Tbilisi time (UTC+4, no DST)
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run feed update
        run: python3 scripts/update-ai-news.py

      - name: Commit and push if changed
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- ai-news.json; then
            git add ai-news.json
            git commit -m "chore: refresh ai-news.json"
            git push
          else
            echo "no changes"
          fi
